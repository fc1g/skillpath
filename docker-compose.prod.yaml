x-common-service-build: &common-service-build
  context: skillpath-backend
  target: runner

services:
  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env.production.local
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  database:
    image: postgres:18-alpine
    hostname: database
    container_name: database
    restart: always
    shm_size: 128mb
    env_file:
      - .env.production.local
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    hostname: redis
    container_name: redis
    restart: always
    shm_size: 128mb
    volumes:
      - redisdata:/data

  bff:
    depends_on:
      courses:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3001/health/live" ]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 60s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: bff
        HTTP_PORT: 3001
    hostname: bff
    container_name: bff_service
    env_file:
      - skillpath-backend/apps/bff/.env.production.local
    ports:
      - "3001:3001"

  auth:
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3002/health/ready" ]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 60s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: auth
        HTTP_PORT: 3002
    command: sh -c "pnpm migrations:run && node dist/apps/auth/main.js"
    hostname: auth_service
    container_name: auth_service
    env_file:
      - skillpath-backend/apps/auth/.env.production.local
    ports:
      - "3002:3002"

  courses:
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3004/health/ready" ]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 60s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: courses
        HTTP_PORT: 3004
    hostname: courses_service
    container_name: courses_service
    env_file:
      - skillpath-backend/apps/courses/.env.production.local
    ports:
      - "3004:3004"

  frontend:
    depends_on:
      bff:
        condition: service_healthy
    build:
      context: skillpath-frontend
      dockerfile: Dockerfile
      target: runner
      args:
        HTTP_PORT: 3000
        INTERNAL_API_URL: https://fc1g-lab.dev/api/v1
        NEXT_PUBLIC_SITE_URL: https://fc1g-lab.dev
        NEXT_PUBLIC_API_URL: https://fc1g-lab.dev/api/v1
    hostname: frontend
    container_name: frontend
    env_file:
      - skillpath-frontend/.env.production.local
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
