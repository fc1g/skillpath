x-common-service-build: &common-service-build
  context: skillpath-backend
  target: runner

services:
  proxy:
    image: nginx:1.29-alpine
    hostname: proxy
    container_name: proxy
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx:/etc/nginx:ro

  database:
    image: postgres:18-alpine
    hostname: database
    container_name: database
    restart: always
    shm_size: 128mb
    env_file:
      - .env.production.local
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    hostname: redis
    container_name: redis
    restart: always
    shm_size: 128mb
    volumes:
      - redisdata:/data

  bff:
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://localhost:3001/health/live' ]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 60s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: bff
        HTTP_PORT: 3001
    hostname: bff
    container_name: bff_service
    env_file:
      - skillpath-backend/apps/bff/.env.production.local

  auth:
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://localhost:3002/health/ready' ]
      interval: 30s
      timeout: 2s
      retries: 5
      start_period: 60s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: auth
        HTTP_PORT: 3002
    hostname: auth_service
    container_name: auth_service
    env_file:
      - skillpath-backend/apps/auth/.env.production.local

  frontend:
    depends_on:
      bff:
        condition: service_healthy
    build:
      context: skillpath-frontend
      dockerfile: Dockerfile
      target: runner
      args:
        HTTP_PORT: 3000
    hostname: frontend
    container_name: frontend
    env_file:
      - skillpath-frontend/.env.production.local

volumes:
  pgdata:
  redisdata: