x-common-service-build: &common-service-build
  context: ./skillpath-backend
  target: dev

services:
  proxy:
    image: nginx:1.29-alpine
    hostname: proxy
    container_name: proxy
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx:/etc/nginx:ro

  database:
    image: postgres:18-alpine
    hostname: database
    container_name: database
    restart: always
    shm_size: 128mb
    env_file:
      - .env.development.local
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    hostname: redis
    container_name: redis
    restart: always
    shm_size: 128mb
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  bff:
    depends_on:
      auth:
        condition: service_healthy
      courses:
        condition: service_healthy
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://localhost:3001/health/live' ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: bff
        HTTP_PORT: 3001
    hostname: bff
    container_name: bff_service
    env_file:
      - skillpath-backend/apps/bff/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  auth:
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://localhost:3002/health/ready' ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: auth
        HTTP_PORT: 3002
    hostname: auth_service
    container_name: auth_service
    env_file:
      - skillpath-backend/apps/auth/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  courses:
    depends_on:
      database:
        condition: service_started
    healthcheck:
      test: [ 'CMD', 'curl', '-fsS', 'http://localhost:3003/health/ready' ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: courses
        HTTP_PORT: 3003
    hostname: courses_service
    container_name: courses_service
    env_file:
      - skillpath-backend/apps/courses/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  frontend:
    depends_on:
      bff:
        condition: service_healthy
    build:
      context: skillpath-frontend
      dockerfile: Dockerfile
      target: dev
      args:
        HTTP_PORT: 3000
    hostname: frontend
    container_name: frontend
    env_file:
      - skillpath-frontend/.env.development.local
    volumes:
      - ./skillpath-frontend:/usr/src/app:cached
      - /usr/src/app/node_modules

volumes:
  pgdata:
  redisdata: