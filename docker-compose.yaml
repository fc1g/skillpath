x-common-service-build: &common-service-build
  context: ./skillpath-backend
  target: dev

services:
  proxy:
    depends_on:
      - frontend
    image: nginx:1.29-alpine
    hostname: proxy
    container_name: proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx:ro

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env.development.local
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

  database:
    image: postgres:18-alpine
    hostname: database
    container_name: database
    restart: always
    shm_size: 128mb
    env_file:
      - .env.development.local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    hostname: redis
    container_name: redis
    restart: always
    shm_size: 128mb
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  bff:
    depends_on:
      auth:
        condition: service_healthy
      courses:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3001/health/live" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: bff
        HTTP_PORT: 3001
    hostname: bff
    container_name: bff_service
    env_file:
      - skillpath-backend/apps/bff/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  auth:
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3002/health/ready" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: auth
        HTTP_PORT: 3002
    hostname: auth_service
    container_name: auth_service
    env_file:
      - skillpath-backend/apps/auth/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  courses:
    depends_on:
      database:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:3004/health/ready" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: courses
        HTTP_PORT: 3004
    hostname: courses_service
    container_name: courses_service
    env_file:
      - skillpath-backend/apps/courses/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  notifications:
    depends_on:
      rabbitmq:
        condition: service_healthy
    build:
      <<: *common-service-build
      args:
        SERVICE_NAME: notifications
        HTTP_PORT: 3005
    hostname: notifications_service
    container_name: notifications_service
    env_file:
      - skillpath-backend/apps/notifications/.env.development.local
    volumes:
      - ./skillpath-backend:/usr/src/app:cached
      - /usr/src/app/node_modules

  frontend:
    depends_on:
      bff:
        condition: service_healthy
    build:
      context: skillpath-frontend
      dockerfile: Dockerfile
      target: dev
      args:
        HTTP_PORT: 3000
    hostname: frontend
    container_name: frontend
    env_file:
      - skillpath-frontend/.env.development.local
    volumes:
      - ./skillpath-frontend:/usr/src/app:cached
      - /usr/src/app/node_modules

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
